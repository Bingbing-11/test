<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>实验七 2.0 — React 课程管理系统（完整版）</title><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>*,::after,::before{box-sizing:border-box;margin:0;padding:0}body{background:linear-gradient(135deg,#667eea 0,#764ba2 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}#root{width:100%;max-width:800px}code{background:rgba(100,100,200,.1);padding:2px 6px;border-radius:4px;font-size:.9em;color:#667eea}kbd{background:#f0f0f0;border:1px solid #ccc;border-radius:4px;padding:1px 5px;font-size:.85em}input[type=text]{transition:all .25s ease}input[type=text]:focus{border-color:#667eea!important;box-shadow:0 0 0 4px rgba(102,126,234,.15)}</style><script defer="defer" src="/test/static/js/main.c0630686.js"></script><link href="/test/static/css/main.35a72ed6.css" rel="stylesheet"></head><body><div id="root"></div><script type="text/babel">const { useState, useEffect, useRef, useCallback, useMemo, memo } = React;

/* ═══════════════════════════════════════════════════════════════════════════
 *  ╔═══════════════════════════════════════════════════════════════════════╗
 *  ║                        自定义 Hooks                                   ║
 *  ╚═══════════════════════════════════════════════════════════════════════╝
 * ═══════════════════════════════════════════════════════════════════════════ */

/**
 * useLocalStorage — 封装 localStorage 读写
 * @param {string} key - 存储键名
 * @param {*} initialValue - 默认值
 * @returns {[any, Function]} [storedValue, setValue]
 */
function useLocalStorage(key, initialValue) {
  const [storedValue, setStoredValue] = useState(() => {
    try {
      const item = localStorage.getItem(key);
      return item !== null ? JSON.parse(item) : initialValue;
    } catch (err) {
      console.warn(`[useLocalStorage] 读取 "${key}" 失败:`, err);
      return initialValue;
    }
  });

  useEffect(() => {
    try {
      localStorage.setItem(key, JSON.stringify(storedValue));
    } catch (err) {
      console.warn(`[useLocalStorage] 写入 "${key}" 失败:`, err);
    }
  }, [key, storedValue]);

  return [storedValue, setStoredValue];
}

/**
 * useDebounce — 防抖 Hook
 * @param {*} value - 需要防抖的值
 * @param {number} delay - 延迟毫秒数，默认 300
 * @returns {*} 防抖后的值
 */
function useDebounce(value, delay = 300) {
  const [debouncedValue, setDebouncedValue] = useState(value);

  useEffect(() => {
    const timer = setTimeout(() => setDebouncedValue(value), delay);
    return () => clearTimeout(timer);
  }, [value, delay]);

  return debouncedValue;
}

/* ═══════════════════════════════════════════════════════════════════════════
 *  ╔═══════════════════════════════════════════════════════════════════════╗
 *  ║                        工具函数                                       ║
 *  ╚═══════════════════════════════════════════════════════════════════════╝
 * ═══════════════════════════════════════════════════════════════════════════ */

/** 生成唯一 ID */
const genId = () => Math.random().toString(36).slice(2, 10);

/* ═══════════════════════════════════════════════════════════════════════════
 *  ╔═══════════════════════════════════════════════════════════════════════╗
 *  ║                        组件：Stats（统计区）                          ║
 *  ╚═══════════════════════════════════════════════════════════════════════╝
 * ═══════════════════════════════════════════════════════════════════════════ */

function Stats({ courses }) {
  const total = courses.length;
  const learned = courses.filter(c => c.learned).length;
  const pending = total - learned;

  const StatItem = ({ label, value, color, icon }) => (
    <div style={{
      display: "flex", alignItems: "center", gap: 8,
      padding: "10px 16px", background: "#fff", borderRadius: 10,
      boxShadow: "0 2px 8px rgba(0,0,0,0.04)", minWidth: 100
    }}>
      <span style={{ fontSize: 20 }}>{icon}</span>
      <div>
        <div style={{ fontSize: 12, color: "#888" }}>{label}</div>
        <div style={{ fontSize: 20, fontWeight: 700, color }}>{value}</div>
      </div>
    </div>
  );

  return (
    <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 20 }}>
      <StatItem label="课程总数" value={total} color="#667eea" icon="📚" />
      <StatItem label="已学习" value={learned} color="#52c41a" icon="✅" />
      <StatItem label="待学习" value={pending} color="#faad14" icon="📖" />
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
 *  ╔═══════════════════════════════════════════════════════════════════════╗
 *  ║                        组件：AddCourseForm（添加表单）                ║
 *  ╚═══════════════════════════════════════════════════════════════════════╝
 * ═══════════════════════════════════════════════════════════════════════════ */

function AddCourseForm({ onAdd }) {
  const [title, setTitle] = useState("");
  const [desc, setDesc] = useState("");
  const titleRef = useRef(null);

  const handleAdd = () => {
    const trimmedTitle = title.trim();
    if (!trimmedTitle) {
      alert("⚠️ 课程名称不能为空");
      titleRef.current?.focus();
      return;
    }
    onAdd(trimmedTitle, desc.trim());
    setTitle("");
    setDesc("");
    titleRef.current?.focus();
  };

  return (
    <div style={{
      background: "#fff", padding: "16px 20px", borderRadius: 12,
      boxShadow: "0 2px 12px rgba(0,0,0,0.06)", marginBottom: 20
    }}>
      <h3 style={{ fontSize: 14, color: "#666", marginBottom: 12 }}>➕ 添加新课程</h3>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        <input
          ref={titleRef}
          style={inputStyle}
          type="text"
          placeholder="课程名称（必填）"
          value={title}
          onChange={(e) => setTitle(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && handleAdd()}
        />
        <input
          style={inputStyle}
          type="text"
          placeholder="课程描述（选填）"
          value={desc}
          onChange={(e) => setDesc(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && handleAdd()}
        />
        <button style={primaryBtnStyle} onClick={handleAdd}>
          ＋ 添加课程
        </button>
      </div>
    </div>
  );
}

const inputStyle = {
  padding: "10px 14px", border: "1.5px solid #e0e0e0", borderRadius: 8,
  fontSize: 14, outline: "none", transition: "all 0.25s ease"
};
const primaryBtnStyle = {
  padding: "10px 20px", background: "linear-gradient(135deg, #667eea 0%, #764ba2 100%)",
  color: "#fff", border: "none", borderRadius: 8, cursor: "pointer",
  fontSize: 14, fontWeight: 600, transition: "transform 0.1s"
};

/* ═══════════════════════════════════════════════════════════════════════════
 *  ╔═══════════════════════════════════════════════════════════════════════╗
 *  ║                        组件：CourseCard（课程卡片）                   ║
 *  ╚═══════════════════════════════════════════════════════════════════════╝
 * ═══════════════════════════════════════════════════════════════════════════ */

const CourseCard = memo(function CourseCard({ course, onDelete, onLearn, onEdit }) {
  const { id, title, desc, learned } = course;

  // 渲染计数（用于演示优化效果）
  const renderCount = useRef(0);
  renderCount.current += 1;

  const handleEdit = () => {
    const newTitle = prompt("✏️ 修改课程标题:", title);
    if (newTitle === null) return;
    const trimmedTitle = newTitle.trim();
    if (!trimmedTitle) { alert("标题不能为空"); return; }
    const newDesc = prompt("📝 修改课程描述:", desc || "");
    if (newDesc === null) return;
    onEdit(id, trimmedTitle, newDesc.trim());
  };

  return (
    <li style={{
      display: "flex", alignItems: "flex-start", gap: 12,
      padding: "14px 18px", background: learned ? "#f6ffed" : "#fff",
      borderRadius: 12, border: `1px solid ${learned ? "#b7eb8f" : "#e8e8e8"}`,
      boxShadow: "0 2px 8px rgba(0,0,0,0.04)", transition: "all 0.2s"
    }}>
      {/* 状态指示 */}
      <div style={{
        width: 40, height: 40, borderRadius: "50%",
        background: learned ? "#52c41a" : "#f0f0f0",
        display: "flex", alignItems: "center", justifyContent: "center",
        fontSize: 18, flexShrink: 0
      }}>
        {learned ? "✅" : "📖"}
      </div>

      {/* 课程信息 */}
      <div style={{ flex: 1, minWidth: 0 }}>
        <h4 style={{ fontSize: 16, color: "#333", marginBottom: 4, wordBreak: "break-all" }}>{title}</h4>
        {desc && <p style={{ fontSize: 13, color: "#666", marginBottom: 6 }}>{desc}</p>}
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <code style={{ fontSize: 11, color: "#999" }}>id: {id}</code>
          <span style={{ fontSize: 11, color: "#ccc" }}>·</span>
          <span style={{ fontSize: 11, color: "#ccc" }}>渲染: {renderCount.current}</span>
        </div>
      </div>

      {/* 操作按钮 */}
      <div style={{ display: "flex", flexDirection: "column", gap: 6, flexShrink: 0 }}>
        <button onClick={() => onLearn(id)} style={{
          padding: "6px 14px", background: learned ? "#f6ffed" : "#e6f7ff",
          color: learned ? "#52c41a" : "#1677ff", border: `1px solid ${learned ? "#b7eb8f" : "#91caff"}`,
          borderRadius: 6, cursor: "pointer", fontSize: 12, fontWeight: 500
        }}>
          {learned ? "已完成" : "开始学习"}
        </button>
        <button onClick={handleEdit} style={{
          padding: "6px 14px", background: "#fff7e6", color: "#fa8c16",
          border: "1px solid #ffd591", borderRadius: 6, cursor: "pointer", fontSize: 12
        }}>
          ✏️ 编辑
        </button>
        <button onClick={() => onDelete(id)} style={{
          padding: "6px 14px", background: "#fff", color: "#ff4d4f",
          border: "1px solid #ffccc7", borderRadius: 6, cursor: "pointer", fontSize: 12
        }}>
          🗑️ 删除
        </button>
      </div>
    </li>
  );
});

/* ═══════════════════════════════════════════════════════════════════════════
 *  ╔═══════════════════════════════════════════════════════════════════════╗
 *  ║                        组件：CourseList（课程列表）                   ║
 *  ╚═══════════════════════════════════════════════════════════════════════╝
 * ═══════════════════════════════════════════════════════════════════════════ */

function CourseList({ courses, searchKeyword, onDelete, onLearn, onEdit }) {
  // 使用 useMemo 缓存筛选结果
  const filteredCourses = useMemo(() => {
    if (!searchKeyword.trim()) return courses;
    const lower = searchKeyword.toLowerCase();
    return courses.filter(c =>
      c.title.toLowerCase().includes(lower) ||
      (c.desc && c.desc.toLowerCase().includes(lower))
    );
  }, [courses, searchKeyword]);

  if (filteredCourses.length === 0) {
    return (
      <div style={{
        textAlign: "center", padding: "60px 20px", color: "#999"
      }}>
        <div style={{ fontSize: 48, marginBottom: 12 }}>🔍</div>
        <p>{courses.length === 0 ? "暂无课程，请先添加 👆" : `未找到 "${searchKeyword}" 相关课程`}</p>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <span style={{ fontSize: 13, color: "#666" }}>
          共 <b>{courses.length}</b> 门课程
          {searchKeyword && <>，筛选后 <b>{filteredCourses.length}</b> 门</>}
        </span>
        <span style={{ fontSize: 11, color: "#aaa", background: "#f5f5f5", padding: "2px 10px", borderRadius: 4 }}>
          useMemo 缓存筛选
        </span>
      </div>
      <ul style={{ listStyle: "none", padding: 0, margin: 0, display: "flex", flexDirection: "column", gap: 10 }}>
        {filteredCourses.map(course => (
          <CourseCard
            key={course.id}
            course={course}
            onDelete={onDelete}
            onLearn={onLearn}
            onEdit={onEdit}
          />
        ))}
      </ul>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
 *  ╔═══════════════════════════════════════════════════════════════════════╗
 *  ║                        主组件：App                                    ║
 *  ╚═══════════════════════════════════════════════════════════════════════╝
 * ═══════════════════════════════════════════════════════════════════════════ */

function App() {
  // 使用自定义 Hook 管理状态并持久化到 localStorage
  const [courses, setCourses] = useLocalStorage("courses_v2", [
    { id: genId(), title: "React 基础入门", desc: "组件、Props、State 核心概念", learned: false },
    { id: genId(), title: "React Hooks 详解", desc: "useState、useEffect、useCallback、useMemo", learned: false },
    { id: genId(), title: "JavaScript 高级", desc: "闭包、原型链、异步编程", learned: true },
    { id: genId(), title: "TypeScript 实战", desc: "类型系统、接口、泛型编程", learned: false },
  ]);

  // 搜索功能
  const [searchInput, setSearchInput] = useState("");
  const searchKeyword = useDebounce(searchInput, 300);

  // useCallback 包装所有回调函数
  const handleAdd = useCallback((title, desc) => {
    setCourses(prev => [...prev, { id: genId(), title, desc, learned: false }]);
  }, []);

  const handleDelete = useCallback((id) => {
    if (window.confirm("确定删除这门课程吗？")) {
      setCourses(prev => prev.filter(c => c.id !== id));
    }
  }, []);

  const handleLearn = useCallback((id) => {
    setCourses(prev => {
      const course = prev.find(c => c.id === id);
      if (course && !course.learned) {
        alert(`🎉 开始学习「${course.title}」，加油！`);
      }
      return prev.map(c => c.id === id ? { ...c, learned: true } : c);
    });
  }, []);

  const handleEdit = useCallback((id, newTitle, newDesc) => {
    setCourses(prev =>
      prev.map(c => c.id === id ? { ...c, title: newTitle, desc: newDesc } : c)
    );
  }, []);

  const handleClearAll = () => {
    if (window.confirm("⚠️ 确定清空所有课程吗？此操作不可恢复！")) {
      setCourses([]);
    }
  };

  return (
    <div style={{
      background: "rgba(255,255,255,0.95)", backdropFilter: "blur(10px)",
      borderRadius: 20, padding: "28px 24px", boxShadow: "0 20px 60px rgba(0,0,0,0.15)"
    }}>
      {/* 页面标题 */}
      <header style={{ textAlign: "center", marginBottom: 24 }}>
        <h1 style={{ fontSize: 26, color: "#333", marginBottom: 6 }}>📚 课程管理系统</h1>
        <p style={{ fontSize: 13, color: "#888" }}>
          React Hooks 综合实践：useState · useEffect · useCallback · useMemo · useRef · useDebounce · useLocalStorage
        </p>
      </header>

      {/* 统计区 */}
      <Stats courses={courses} />

      {/* 搜索框 */}
      <div style={{ position: "relative", marginBottom: 20 }}>
        <span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", fontSize: 16 }}>🔍</span>
        <input
          style={{ ...inputStyle, paddingLeft: 40, width: "100%" }}
          type="text"
          placeholder="搜索课程名称或描述..."
          value={searchInput}
          onChange={(e) => setSearchInput(e.target.value)}
        />
        {searchInput && (
          <button
            onClick={() => setSearchInput("")}
            style={{ position: "absolute", right: 14, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", cursor: "pointer", fontSize: 14, color: "#999" }}
          >
            ✕
          </button>
        )}
      </div>

      {/* 添加表单 */}
      <AddCourseForm onAdd={handleAdd} />

      {/* 课程列表 */}
      <CourseList
        courses={courses}
        searchKeyword={searchKeyword}
        onDelete={handleDelete}
        onLearn={handleLearn}
        onEdit={handleEdit}
      />

      {/* 底部操作 */}
      {courses.length > 0 && (
        <div style={{ marginTop: 24, paddingTop: 20, borderTop: "1px dashed #e0e0e0", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <Stats courses={courses} />
          <button onClick={handleClearAll} style={{
            padding: "8px 16px", background: "#fff", color: "#ff4d4f",
            border: "1px solid #ffccc7", borderRadius: 6, cursor: "pointer", fontSize: 13
          }}>
            🗑️ 清空全部
          </button>
        </div>
      )}

      {/* 技术说明 */}
      <footer style={{ marginTop: 28, paddingTop: 20, borderTop: "1px solid #f0f0f0" }}>
        <details>
          <summary style={{ cursor: "pointer", color: "#888", fontSize: 13, userSelect: "none" }}>
            📖 点击查看技术实现说明
          </summary>
          <div style={{ marginTop: 12, padding: 16, background: "#f8f9fa", borderRadius: 10, fontSize: 12, lineHeight: 1.8, color: "#555" }}>
            <p><b>useLocalStorage</b>：自定义 Hook，实现状态与 localStorage 的双向同步</p>
            <p><b>useDebounce</b>：自定义 Hook，对搜索输入进行 300ms 防抖处理</p>
            <p><b>useCallback</b>：缓存所有事件处理函数，避免子组件不必要的重渲染</p>
            <p><b>useMemo</b>：缓存筛选后的课程列表，仅在 courses 或 searchKeyword 变化时重新计算</p>
            <p><b>React.memo</b>：CourseCard 组件使用 memo 包裹，props 不变时跳过渲染</p>
            <p><b>useRef</b>：AddCourseForm 中用于自动聚焦输入框，CourseCard 中用于统计渲染次数</p>
          </div>
        </details>
      </footer>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
 *  挂载应用
 * ═══════════════════════════════════════════════════════════════════════════ */
ReactDOM.createRoot(document.getElementById("root")).render(<App />);</script></body></html>
